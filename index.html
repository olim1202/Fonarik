<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Фонарик</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      transition: background 0.25s, color 0.25s;
      user-select: none;
    }

    body.on {
      background: #fff;
      color: #111;
    }

    #torch {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #444;
      background: #222;
      color: #fff;
      font-size: 72px;
      cursor: pointer;
      transition: transform 0.1s, background 0.25s, box-shadow 0.25s, border-color 0.25s;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    }

    #torch:active { transform: scale(0.94); }

    body.on #torch {
      background: #fff8c4;
      border-color: #ffd000;
      box-shadow: 0 0 90px 30px rgba(255, 220, 0, 0.6);
    }

    #status {
      margin-top: 28px;
      font-size: 20px;
      font-weight: 600;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      opacity: 0.6;
      padding: 0 16px;
    }

    #sos {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border: 2px solid currentColor;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      opacity: 0.8;
    }

    #sos.active { opacity: 1; background: currentColor; }
    #sos.active span { color: #111; }
  </style>
</head>
<body>
  <button id="torch" aria-label="Включить фонарик">💡</button>
  <p id="status">Фонарик выключен</p>
  <button id="sos">SOS: выкл</button>
  <p id="hint"></p>

  <script>
    const body = document.body;
    const torchBtn = document.getElementById('torch');
    const statusEl = document.getElementById('status');
    const sosBtn = document.getElementById('sos');
    const hintEl = document.getElementById('hint');

    let isOn = false;
    let track = null;        // камера со вспышкой (если поддерживается)
    let sosTimer = null;
    let wakeLock = null;

    // Пробуем включить настоящую вспышку камеры
    async function getTorchTrack() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        const t = stream.getVideoTracks()[0];
        const caps = t.getCapabilities ? t.getCapabilities() : {};
        if (caps.torch) return t;
        t.stop();
        return null;
      } catch (e) {
        return null;
      }
    }

    async function setCameraTorch(on) {
      if (on) {
        if (!track) track = await getTorchTrack();
        if (track) {
          try {
            await track.applyConstraints({ advanced: [{ torch: true }] });
            return true;
          } catch (e) { return false; }
        }
        return false;
      } else if (track) {
        track.stop();
        track = null;
      }
      return false;
    }

    async function keepScreenAwake(on) {
      try {
        if (on && 'wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        } else if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {}
    }

    async function setLight(on) {
      isOn = on;
      body.classList.toggle('on', on);
      torchBtn.textContent = on ? '🔆' : '💡';
      torchBtn.setAttribute('aria-pressed', on);
      statusEl.textContent = on ? 'Фонарик включен' : 'Фонарик выключен';
      keepScreenAwake(on);

      const cameraOn = await setCameraTorch(on);
      hintEl.textContent = on && cameraOn
        ? 'Работает вспышка камеры и экран'
        : on ? 'Работает экран (вспышка камеры недоступна)' : '';
    }

    torchBtn.addEventListener('click', () => {
      if (sosTimer) stopSos();
      setLight(!isOn);
    });

    // SOS: ... --- ...
    const SOS_PATTERN = [200,200,200,200,200,600, 600,200,600,200,600,600, 200,200,200,200,200,1400];

    function playSos(step = 0) {
      const on = step % 2 === 0;
      const index = Math.floor(step / 2);
      if (on) setLight(true); else setLight(false);
      const duration = SOS_PATTERN[step % SOS_PATTERN.length];
      sosTimer = setTimeout(() => playSos(step + 1), duration);
    }

    function stopSos() {
      clearTimeout(sosTimer);
      sosTimer = null;
      sosBtn.classList.remove('active');
      sosBtn.textContent = 'SOS: выкл';
      setLight(false);
    }

    sosBtn.addEventListener('click', () => {
      if (sosTimer) {
        stopSos();
      } else {
        sosBtn.classList.add('active');
        sosBtn.textContent = 'SOS: вкл';
        playSos(0);
      }
    });

    // Выключаем свет и вспышку, если вкладка скрыта
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isOn) {
        stopSos();
        setLight(false);
      }
    });
  </script>
</body>
</html>
